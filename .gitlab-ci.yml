# Taste Overlap - what happens after the code is written.
# test -> deploy (Render deploy hook, only main) -> smoke (a real plan against the live URL) -> release notes.
# Secrets never go into the repo. RENDER_DEPLOY_HOOK is a protected CI/CD variable (its URL contains '?key=', which GitLab
# may refuse to mask) - so: protected, never echoed, and never run this pipeline with CI_DEBUG_TRACE. The Qloo key lives only on Render.

stages: [test, deploy, verify, release]

default:
  image: node:22

variables:
  LIVE_URL: "https://taste-overlap.onrender.com"

test:
  stage: test
  script:
    - node --version
    - node --test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

deploy:
  stage: deploy
  image: curlimages/curl:8.10.1
  script:
    - test -n "$RENDER_DEPLOY_HOOK" || (echo "RENDER_DEPLOY_HOOK is not set" && exit 1)
    - curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK" -o deploy.json
    - echo "deploy triggered for $CI_COMMIT_SHORT_SHA"
  artifacts:
    paths: [deploy.json]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

smoke:
  stage: verify
  script:
    # Waits until /api/health reports this commit (proves the new version is live), then checks /mcp and one real plan.
    - set -o pipefail
    - EXPECT_COMMIT="$CI_COMMIT_SHORT_SHA" node scripts/smoke.mjs "$LIVE_URL" 600 | tee smoke.txt
  artifacts:
    paths: [smoke.txt]
    when: always
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release_notes:
  stage: release
  script:
    - git log --format='- %s (%h)' -n 20 > RELEASE_NOTES.md
    - cat RELEASE_NOTES.md
  artifacts:
    paths: [RELEASE_NOTES.md]
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
